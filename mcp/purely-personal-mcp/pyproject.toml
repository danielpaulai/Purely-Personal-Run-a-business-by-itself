[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purely-personal-mcp"
version = "2.0.0"
description = "Purely Personal MCP: the 12 program skills, locked to each participant's own Business Brain, ICP and Voice DNA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.27,<2", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
purely-personal-mcp = "pp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
